<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>IncomeApp</title>
<meta name="color-scheme" content="dark" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1F1C;
    --surface:#0F2B26;
    --surface-2:#153730;
    --surface-3:#1C443C;
    --primary:#1FAA6A;
    --primary-dark:#0E5C43;
    --gold:#E8B33D;
    --gold-dark:#B9852A;
    --text:#EFF6F2;
    --text-muted:#8FB0A6;
    --danger:#E1584A;
    --border:rgba(255,255,255,0.08);
    --radius-hero:26px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Hind Siliguri', 'Manrope', sans-serif;
    font-size:15px; line-height:1.5;
    overscroll-behavior-y:none;
  }
  .num{ font-family:'Manrope','Hind Siliguri',sans-serif; font-variant-numeric: tabular-nums; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  /* ── Topbar ── */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 6px;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; letter-spacing:.2px; }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--primary); box-shadow:0 0 10px var(--primary); }
  .coin-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border);
    padding:6px 12px; border-radius:999px; font-weight:700; font-size:13px;
    color:var(--gold);
  }
  .coin-pill svg{ width:15px; height:15px; }

  /* ── Scroll area ── */
  #view-root{ flex:1; overflow-y:auto; padding:6px 18px 100px; }
  #view-root::-webkit-scrollbar{ display:none; }

  /* ── Hero balance card ── */
  .hero{
    position:relative; overflow:hidden;
    margin-top:8px;
    border-radius:var(--radius-hero);
    background:linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 70%, #29c47d 100%);
    padding:22px 22px 20px;
    box-shadow:0 14px 30px -14px rgba(31,170,106,0.55);
  }
  .hero::before{
    content:''; position:absolute; inset:0;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 26px);
    opacity:.5; pointer-events:none;
  }
  .hero-label{ font-size:12.5px; color:rgba(255,255,255,0.8); font-weight:500; }
  .hero-amount{ font-size:38px; font-weight:800; margin:2px 0 14px; letter-spacing:.2px; }
  .hero-amount small{ font-size:19px; font-weight:700; opacity:.85; margin-right:2px; }
  .hero-stats{ display:flex; gap:10px; position:relative; }
  .hero-stat{
    flex:1; background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.14);
    border-radius:14px; padding:9px 10px;
  }
  .hero-stat .k{ font-size:11px; color:rgba(255,255,255,0.75); }
  .hero-stat .v{ font-size:15px; font-weight:700; margin-top:1px; }

  .notice-banner{
    margin-top:12px; padding:12px 14px; border-radius:14px;
    background:var(--surface-2); border:1px solid var(--border);
    font-size:13.5px; color:var(--text-muted); display:flex; gap:8px;
  }
  .notice-banner b{ color:var(--gold); }

  /* ── Section ── */
  .section-title{ font-size:13.5px; font-weight:700; color:var(--text-muted); margin:22px 2px 10px; }

  .quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .quick-btn{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:14px 6px; color:var(--text);
    font-size:12px; font-weight:600; text-align:center;
  }
  .quick-btn .ic{
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-3);
  }
  .quick-btn .ic svg{ width:19px; height:19px; }
  .quick-btn:active{ transform:scale(.96); }

  .list{ background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  .list-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 14px; border-bottom:1px solid var(--border);
  }
  .list-row:last-child{ border-bottom:none; }
  .list-row .l{ color:var(--text-muted); font-size:13.5px; }
  .list-row .r{ font-weight:700; font-size:13.5px; }

  /* ── Buttons / inputs ── */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px 16px; border:none; border-radius:999px;
    font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn-primary{ background:var(--primary); color:#04211a; }
  .btn-primary:disabled{ background:var(--surface-3); color:var(--text-muted); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-gold{ background:var(--gold); color:#3a2405; }
  .btn:active{ transform:scale(.98); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-family:inherit; font-size:14.5px;
  }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; padding:11px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); font-family:inherit; font-weight:700; font-size:13.5px;
  }
  .seg button.active{ background:var(--primary); border-color:var(--primary); color:#04211a; }

  .tax-note{
    display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--text-muted);
    background:var(--surface-2); border:1px dashed var(--border); border-radius:12px; padding:10px 12px; margin:4px 0 16px;
  }
  .tax-note b{ color:var(--gold); }

  /* ── Refer view ── */
  .code-card{
    background:var(--surface); border:1px dashed var(--border); border-radius:16px;
    padding:16px; text-align:center; margin-bottom:14px;
  }
  .code-card .code{ font-family:'Manrope',sans-serif; font-size:24px; font-weight:800; letter-spacing:2px; color:var(--gold); }
  .code-card .sub{ font-size:12px; color:var(--text-muted); margin-top:4px; }
  .row-2{ display:flex; gap:10px; margin-bottom:16px; }
  .steps{ display:flex; flex-direction:column; gap:10px; }
  .step{ display:flex; gap:10px; align-items:flex-start; }
  .step .n{
    width:22px; height:22px; flex:none; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--gold);
  }
  .step p{ margin:0; font-size:13.5px; color:var(--text-muted); }

  /* ── Spin view ── */
  .spin-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:6px; }
  .wheel-frame{ position:relative; width:264px; height:264px; margin:6px 0 20px; }
  .wheel-pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent;
    border-top:18px solid var(--gold); z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .wheel{
    width:100%; height:100%; border-radius:50%; position:relative;
    border:6px solid var(--surface-3); box-shadow:0 0 0 2px var(--border), 0 20px 40px -18px rgba(0,0,0,.6);
    transition: transform 3.4s cubic-bezier(.17,.89,.28,1);
  }
  .wheel .seg-label{
    position:absolute; top:50%; left:50%; width:110px; text-align:right; padding-right:14px;
    font-size:11px; font-weight:700; color:#fff; transform-origin:left center;
  }
  .wheel-hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; background:var(--gold); z-index:2;
    display:flex; align-items:center; justify-content:center; color:#3a2405; font-weight:800; font-size:11px;
    box-shadow:0 0 0 5px var(--bg);
  }
  .spin-meta{ font-size:12.5px; color:var(--text-muted); margin-bottom:16px; text-align:center; }
  .spin-meta b{ color:var(--gold); }

  /* ── Profile ── */
  .profile-head{ display:flex; align-items:center; gap:12px; margin:6px 0 18px; }
  .avatar{
    width:52px; height:52px; border-radius:50%; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:var(--gold);
  }
  .profile-head .name{ font-weight:700; font-size:16.5px; }
  .profile-head .phone{ font-size:12.5px; color:var(--text-muted); }
  .support-row{ display:flex; gap:10px; }

  /* ── Tabbar ── */
  .tabbar{
    position:sticky; bottom:0; left:0; right:0;
    display:flex; background:rgba(15,43,38,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:8px 6px calc(8px + var(--safe-bottom));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-muted); font-family:inherit; font-size:10.5px; font-weight:600;
    padding:6px 0;
  }
  .tab svg{ width:21px; height:21px; }
  .tab.active{ color:var(--primary); }

  /* ── Overlays ── */
  #toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:#1C443C; border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:50; white-space:nowrap;
    max-width:88vw; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,10,9,0.7); display:flex; align-items:flex-end; justify-content:center;
    z-index:60;
  }
  .modal-sheet{
    width:100%; max-width:520px; background:var(--surface); border-radius:22px 22px 0 0;
    padding:22px 20px calc(22px + var(--safe-bottom)); border:1px solid var(--border); border-bottom:none;
  }
  .modal-sheet h3{ margin:0 0 6px; font-size:16.5px; }
  .modal-sheet p{ margin:0 0 18px; font-size:13.5px; color:var(--text-muted); }

  .center-screen{
    min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:20px;
  }
  .center-screen .ic-big{ width:64px; height:64px; opacity:.9; }
  .center-screen h2{ margin:0; font-size:18px; }
  .center-screen p{ margin:0; font-size:13.5px; color:var(--text-muted); max-width:300px; }

  .skeleton{ background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:16px; }
  @keyframes sk{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> IncomeApp</div>
    <div class="coin-pill" id="coinPill">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v10M9 9.5h4.2a1.8 1.8 0 0 1 0 3.6H10a1.8 1.8 0 0 0 0 3.6H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="coinCount" class="num">০</span>
    </div>
  </div>
  <main id="view-root"><div class="skeleton" style="height:220px;margin-top:8px;"></div></main>
  <nav class="tabbar" id="tabbar" style="display:none;">
    <button class="tab" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      হোম
    </button>
    <button class="tab" data-view="refer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.5c1.7.4 3 2 3 3.9 0 1.9-1.3 3.5-3 3.9M21 20c0-2.6-1.8-4.6-4.3-5.3"/></svg>
      রেফার
    </button>
    <button class="tab" data-view="spin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 12 17 8"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
      স্পিন
    </button>
    <button class="tab" data-view="wallet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10h17"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>
      ওয়ালেট
    </button>
    <button class="tab" data-view="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.2" r="3.4"/><path d="M4.8 20c1-3.6 4-5.6 7.2-5.6s6.2 2 7.2 5.6"/></svg>
      প্রোফাইল
    </button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor('#0A1F1C'); tg.setBackgroundColor('#0A1F1C'); }catch(e){} }

const initData = tg ? tg.initData : '';
const state = { me:null, pub:null, view:'home' };

function bn(n){
  const d={'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯','.':'.','-':'-'};
  let s = (typeof n==='number') ? (Number.isInteger(n) ? String(n) : n.toFixed(2)) : String(n ?? '');
  return s.split('').map(c=>d[c]??c).join('');
}
function haptic(kind){ if(tg && tg.HapticFeedback){ try{ kind==='ok' ? tg.HapticFeedback.notificationOccurred('success') : kind==='err' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.impactOccurred('light'); }catch(e){} } }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2600);
}
function openSheet(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="mb"><div class="modal-sheet">${html}</div></div>`;
  root.querySelector('#mb').addEventListener('click', (e)=>{ if(e.target.id==='mb') closeSheet(); });
}
function closeSheet(){ document.getElementById('modal-root').innerHTML=''; }

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json','X-Telegram-Init-Data': initData}, opts.headers||{});
  const r = await fetch(path, Object.assign({method:'GET'}, opts, {headers}));
  let data = null;
  try{ data = await r.json(); }catch(e){ data = {}; }
  if(!r.ok){ const err = new Error(data.error||'error'); err.data = data; err.status = r.status; throw err; }
  return data;
}

const ERR_MAP = {
  already_claimed:'আজকের বোনাস ইতোমধ্যে নেওয়া হয়েছে।',
  insufficient_coins:'পর্যাপ্ত কয়েন নেই — বিজ্ঞাপন দেখে কয়েন সংগ্রহ করুন।',
  insufficient_coins_tax:'সার্ভিস ট্যাক্সের জন্য পর্যাপ্ত কয়েন নেই।',
  insufficient_balance:'পর্যাপ্ত ব্যালেন্স নেই।',
  daily_limit:'আজকের সীমা শেষ — কাল আবার চেষ্টা করুন।',
  below_minimum:'সর্বনিম্ন পরিমাণের কম উত্তোলন করা যাবে না।',
  invalid_number:'সঠিক ১১ সংখ্যার নম্বর দিন।',
  invalid_amount:'সঠিক পরিমাণ লিখুন।',
  not_active:'একাউন্ট এখনো একটিভ নয়।',
  maintenance:'অ্যাপটি সাময়িক মেইনটেন্যান্সে আছে।',
  server_error:'সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।',
};
function errMsg(e){ return ERR_MAP[e && e.data && e.data.error] || ERR_MAP[e && e.message] || 'কিছু একটা সমস্যা হয়েছে।'; }

/* ── Bootstrap ── */
async function boot(){
  try{
    state.pub = await api('/api/public-config').catch(()=>({}));
    const me = await api('/api/me');
    if(me.error === 'not_registered') return renderGate('not_registered');
    if(me.notActive) return renderGate('not_active', me);
    state.me = me;
    document.getElementById('tabbar').style.display = 'flex';
    updateCoinPill();
    goto('home');
  }catch(e){
    if(e.status===404 || (e.data&&e.data.error==='not_registered')) return renderGate('not_registered');
    if(e.status===503) return renderGate('maintenance');
    renderGate('error', {message:e.message});
  }
}

function updateCoinPill(){
  document.getElementById('coinCount').textContent = bn(state.me.user.coins || 0);
}

function renderGate(kind, extra){
  document.getElementById('tabbar').style.display='none';
  const root = document.getElementById('view-root');
  const openBot = ()=>{ const u = state.pub && state.pub.botUsername; if(u && tg) tg.openTelegramLink('https://t.me/'+u); };
  const screens = {
    not_registered: {
      icon:'🪪', title:'প্রথমে একাউন্ট তৈরি করুন',
      text:'IncomeApp বটে গিয়ে /start দিয়ে রেজিস্ট্রেশন ও পেমেন্ট ভেরিফিকেশন সম্পন্ন করুন। এরপর এই Mini App থেকে সব সুবিধা ব্যবহার করতে পারবেন।',
      btn:'বটে যান',
    },
    not_active: {
      icon: extra && extra.status==='review' ? '⏳' : extra && extra.status==='banned' ? '🚫' : extra && extra.status==='rejected' ? '❌' : '💳',
      title: extra && extra.status==='review' ? 'পর্যালোচনা চলছে'
           : extra && extra.status==='banned' ? 'একাউন্ট বন্ধ করা হয়েছে'
           : extra && extra.status==='rejected' ? 'পেমেন্ট রিজেক্ট হয়েছে'
           : 'একাউন্ট একটিভেশন বাকি',
      text: extra && extra.status==='review' ? 'অ্যাডমিন আপনার পেমেন্ট চেক করছেন। ২-৩ ঘণ্টার মধ্যে একটিভ হবে।'
          : extra && extra.status==='banned' ? 'নিয়ম ভঙ্গের কারণে একাউন্ট বন্ধ করা হয়েছে। সাপোর্টে যোগাযোগ করুন।'
          : extra && extra.status==='rejected' ? 'পুনরায় সঠিক পেমেন্ট করতে বটে গিয়ে /pay দিন।'
          : 'বটে গিয়ে পেমেন্ট সম্পন্ন করুন, তারপর Mini App সক্রিয় হবে।',
      btn:'বটে যান',
    },

function wheelBackground(){

function renderSpin(){

        <span class="r num">${bn(u.coins)} 🪙</span>
      </div>
    </div>

  `;
  document.getElementById('spinBtn').onclick = doSpin;
  document.getElementById('watchAdBtn').onclick = ()=>watchAd();

let spinning = false;
async function doSpin(){
  if(spinning) return;
  spinning = true;
  const btn = document.getElementById('spinBtn'); if(btn) btn.disabled = true;
  try{
    haptic();
    const r = await api('/api/spin', {method:'POST'});
    state.me.user.points = r.points; state.me.user.coins = r.coins;
    state.me.spins.used = r.spinsUsedToday; state.me.spins.remainingFree = r.remainingFree ?? state.me.spins.remainingFree;
    updateCoinPill();

    const wheel = document.getElementById('wheel');
    const n = SEGMENTS.length, step = 360/n;
    const targetAngle = 360 - (r.segmentIndex*step + step/2);
    const extraTurns = 5*360;
    const current = wheelRotation();
    const finalRotation = current - (current % 360) + extraTurns + targetAngle;
    wheel.style.transform = `rotate(${finalRotation}deg)`;
    wheel.dataset.rotation = finalRotation;

    setTimeout(()=>{
      haptic(r.segment.points>0||r.segment.coins>0 ? 'ok' : undefined);
      const parts = [];
      if(r.segment.points) parts.push(`+${bn(r.segment.points)} পয়েন্ট`);
      if(r.segment.coins) parts.push(`+${bn(r.segment.coins)} কয়েন`);
      toast(parts.length ? `🎉 ${parts.join(' ও ')} পেয়েছেন!` : 'এবার কিছু পাননি, আবার চেষ্টা করুন!');
      spinning = false;
      renderSpin();
    }, 3500);
  }catch(e){
    spinning = false; if(btn) btn.disabled = false;
    haptic('err'); toast(errMsg(e));
  }
}
function wheelRotation(){
  const w = document.getElementById('wheel');
  return w && w.dataset.rotation ? parseFloat(w.dataset.rotation) : 0;
}

      return;
    }catch(e){ /* Adsgram না থাকলে নিচের Monetag ফ্লোতে যাবে */ }
  }

function openMonetagAd(onDone){
  let rewarded = false;
  let minWaitPassed = false;
  let minWaitTimer = null;

  openSheet(`
    <h3>📺 বিজ্ঞাপন দেখুন</h3>
    <p>নিচের বাটনে চাপ দিলে বিজ্ঞাপনটি খুলবে। বিজ্ঞাপন দেখে অ্যাপে ফিরে এলে স্বয়ংক্রিয়ভাবে কয়েন যোগ হয়ে যাবে।</p>
    <button class="btn btn-primary" id="adOpenBtn">▶️ বিজ্ঞাপন দেখুন</button>
  `);

  const btn = document.getElementById('adOpenBtn');
  if(!btn) return;

  function cleanup(){
    document.removeEventListener('visibilitychange', onVisible);
    if(minWaitTimer) clearTimeout(minWaitTimer);
  }
  function claim(){
    if(rewarded) return;
    rewarded = true;
    cleanup();
    closeSheet();
    onDone();
  }
  function onVisible(){
    if(document.visibilityState === 'visible' && minWaitPassed) claim();
  }

  btn.onclick = ()=>{
    btn.disabled = true;
    btn.textContent = 'বিজ্ঞাপন খোলা হচ্ছে…';
    haptic();
    if (tg && tg.openLink) tg.openLink(MONETAG_DIRECT_LINK, { try_instant_view:false });
    else window.open(MONETAG_DIRECT_LINK, '_blank');

    document.addEventListener('visibilitychange', onVisible);
    minWaitTimer = setTimeout(()=>{
      minWaitPassed = true;
      if(document.visibilityState === 'visible') claim();
    }, AD_MIN_WAIT_MS);
  };
}

      <button class="btn btn-outline" id="btnSupportWa">📞 হোয়াটসঅ্যাপ</button>
    </div>
    <div class="section-title">সমস্যা রিপোর্ট</div>
    <div class="notice-banner" style="margin-bottom:8px;">🚨 <span>সমস্যা রিপোর্ট করতে বটে গিয়ে <b>/report</b> কমান্ড দিন। ২৪ ঘণ্টায় একটি রিপোর্ট গ্রহণযোগ্য।</span></div>
    <button class="btn btn-outline" id="btnOpenBot" style="margin-bottom:30px;">🤖 বটে যান</button>
  `;
  document.getElementById('btnSupportTg').onclick = ()=>{ if(tg) tg.openTelegramLink('https://t.me/'+s.supportTg); };
  document.getElementById('btnSupportWa').onclick = ()=>{ const url='https://wa.me/'+ (s.supportWa||'').replace(/^0/,'88'); if(tg) tg.openLink(url); else window.open(url,'_blank'); };
  document.getElementById('btnOpenBot').onclick = ()=>{ const bu = state.pub && state.pub.botUsername; if(bu && tg) tg.openTelegramLink('https://t.me/'+bu); };
}

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
